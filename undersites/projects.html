    <div class="stage">
    <button class="arrow" id="prevButton">‹</button>
    <div class="book" id="book">
      <div class="page" id="page"></div>
    </div>
    <button class="arrow" id="nextButton">›</button>
    </div>
</div>
    <script>
const pages = [
  { src: "../graphics/side 1.png", title: "Kyoto Performing Arts Hall" },
  { src: "../graphics/side2.png", title: "Kyoto Garden Museum" },
  { src: "../graphics/side3.png", title: "Western Castle" },
  { src: "../graphics/side4.png", title: "Taipei Night Market" },
  { src: "../graphics/side5.png", title: "Osaka Castle" },
];

gsap.registerPlugin(CustomEase);
CustomEase.create("pageTurn", ".42,.05,.25,1");

let currentPage = 0;
let flipTween = null;

const halfImage = (pageIndex, side) =>
  `<img src="${pages[pageIndex].src}" class="${side}">`;

function showPage(pageIndex) {
  currentPage = pageIndex;
  const pageEl = document.getElementById("page");
  pageEl.innerHTML = `
    <div class="half left">${halfImage(pageIndex, "left")}</div>
    <div class="half right">${halfImage(pageIndex, "right")}</div>`;
  
  const captionEl = document.getElementById("caption");
  if (captionEl) {
    captionEl.textContent = pages[pageIndex].title;
    gsap.fromTo(captionEl, { opacity: 0 }, { opacity: 1, duration: 0.4, overwrite: "auto" });
  }
}

function turn(direction, duration = 0.85, ease = "pageTurn", onDone) {
  if (flipTween && flipTween.isActive()) {
    flipTween.progress(1);
  }

  const goingNext = direction === "next";
  const targetPage = (currentPage + (goingNext ? 1 : -1) + pages.length) % pages.length;

  const liftSide = goingNext ? "right" : "left";
  const landSide = goingNext ? "left" : "right";
  const bookEl = document.getElementById("book");

  const flap = document.createElement("div");
  flap.className = `flap ${goingNext ? "next" : "prev"}`;
  flap.innerHTML = `
    <div class="face front">${halfImage(currentPage, liftSide)}</div>
    <div class="face back">${halfImage(targetPage, landSide)}</div>
  `;
  bookEl.appendChild(flap);

  gsap.set(flap, { transformOrigin: goingNext ? "left center" : "right center" });
  gsap.set(flap.querySelector(".face.back img"), { scaleX: -1 });

  flipTween = gsap.timeline({
    onComplete: () => {
      flap.remove();
      if (onDone) onDone();
    }
  });

  flipTween.to(flap, {
    rotationY: goingNext ? -90 : 90,
    duration: duration / 2,
    ease: "power1.in"
  });

  flipTween.call(() => {
    showPage(targetPage);
  });

  flipTween.to(flap, {
    rotationY: goingNext ? -180 : 180,
    duration: duration / 2,
    ease: "power1.out"
  });
}

document.getElementById("nextButton").addEventListener("click", () => turn("next"));
document.getElementById("prevButton").addEventListener("click", () => turn("prev"));

showPage(0);
  </script>
